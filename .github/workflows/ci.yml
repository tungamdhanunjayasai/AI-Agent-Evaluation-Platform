name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_eval_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_eval_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create isolated databases
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE agent_eval_ci"
          psql -h localhost -U postgres -c "CREATE DATABASE agent_eval_test"
      - name: Install test dependencies
        run: pip install -e ".[test]"
      - name: Ruff
        run: python -m ruff check app tests scripts
      - name: Tests
        run: python -m pytest
